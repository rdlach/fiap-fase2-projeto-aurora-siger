<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <defs>
    <filter id="paperShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#312d27" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowSage" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#66785f"/>
    </marker>
    <marker id="arrowClay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#a45d45"/>
    </marker>
    <style>
      .bg { fill: #f1ece3; }
      .paper { fill: #fbfaf6; stroke: #d7d0c4; stroke-width: 2; filter: url(#paperShadow); }
      .soft { fill: #eee7db; stroke: #d7d0c4; stroke-width: 2; }
      .ink { fill: #282d2f; }
      .muted { fill: #6d6a63; }
      .small { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 18px; fill: #6d6a63; }
      .tiny { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 15px; fill: #777269; }
      .eyebrow { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 4px; fill: #777269; }
      .title { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 58px; font-weight: 800; fill: #282d2f; }
      .subtitle { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 24px; fill: #5e625f; }
      .panelTitle { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 42px; font-weight: 800; fill: #282d2f; }
      .label { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #33383a; }
      .formulaSage { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 32px; font-weight: 800; fill: #53694f; }
      .formulaClay { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 32px; font-weight: 800; fill: #8d4b39; }
      .chipText { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #fbfaf6; }
      .gateText { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #282d2f; }
      .ruleNum { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #fbfaf6; }
      .wire { stroke: #757b78; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wireSoft { stroke: #a9a195; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .sageWire { stroke: #66785f; stroke-width: 5; fill: none; stroke-linecap: round; marker-end: url(#arrowSage); }
      .clayWire { stroke: #a45d45; stroke-width: 5; fill: none; stroke-linecap: round; marker-end: url(#arrowClay); }
      .gate { fill: #fbfaf6; stroke: #282d2f; stroke-width: 4; }
      .notDot { fill: #fbfaf6; stroke: #282d2f; stroke-width: 3; }
      .node { fill: #282d2f; }
      .sageBox { fill: #eef2e9; stroke: #66785f; stroke-width: 3; }
      .clayBox { fill: #f5e9e3; stroke: #a45d45; stroke-width: 3; }
      .amberBox { fill: #f6efd9; stroke: #b58a35; stroke-width: 3; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1600"/>
  <path d="M 96 238 H 1498" class="wireSoft"/>
  <path d="M 96 1510 H 1498" class="wireSoft"/>

  <text class="eyebrow" x="96" y="96">GRUPO 42 | AURORA SIGER</text>
  <text class="title" x="96" y="168">Diagrama logico do MGPEB</text>
  <text class="subtitle" x="98" y="214">Decisao de pouso em Marte a partir dos checks usados no prototipo Python.</text>

  <g transform="translate(96 286)">
    <rect class="paper" x="0" y="0" width="394" height="1112" rx="18"/>
    <text class="eyebrow" x="34" y="56">ENTRADAS</text>
    <text class="subtitle" x="34" y="96">Sinais booleanos</text>

    <g transform="translate(34 148)">
      <rect x="0" y="0" width="326" height="92" rx="12" fill="#f6f2eb" stroke="#ded5c9"/>
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#53694f"/>
      <text class="chipText" x="46" y="53" text-anchor="middle">A</text>
      <text class="label" x="92" y="38">combCheck</text>
      <text class="small" x="92" y="66">combustivel suficiente</text>
    </g>

    <g transform="translate(34 280)">
      <rect x="0" y="0" width="326" height="92" rx="12" fill="#f6f2eb" stroke="#ded5c9"/>
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#b58a35"/>
      <text class="chipText" x="46" y="53" text-anchor="middle">B</text>
      <text class="label" x="92" y="38">atmCheck</text>
      <text class="small" x="92" y="66">atmosfera estavel</text>
    </g>

    <g transform="translate(34 412)">
      <rect x="0" y="0" width="326" height="92" rx="12" fill="#f6f2eb" stroke="#ded5c9"/>
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#66785f"/>
      <text class="chipText" x="46" y="53" text-anchor="middle">C</text>
      <text class="label" x="92" y="38">areaCheck</text>
      <text class="small" x="92" y="66">area de pouso livre</text>
    </g>

    <g transform="translate(34 544)">
      <rect x="0" y="0" width="326" height="92" rx="12" fill="#f6f2eb" stroke="#ded5c9"/>
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#596579"/>
      <text class="chipText" x="46" y="53" text-anchor="middle">D</text>
      <text class="label" x="92" y="38">sensCheck</text>
      <text class="small" x="92" y="66">sensores integros</text>
    </g>

    <g transform="translate(34 676)">
      <rect x="0" y="0" width="326" height="92" rx="12" fill="#f6f2eb" stroke="#ded5c9"/>
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#a45d45"/>
      <text class="chipText" x="46" y="53" text-anchor="middle">E</text>
      <text class="label" x="92" y="38">massaCheck</text>
      <text class="small" x="92" y="66">massa dentro do limite</text>
    </g>

    <rect class="soft" x="34" y="884" width="326" height="144" rx="16"/>
    <text class="small" x="58" y="924">Cada check vira 1 ou 0.</text>
    <text class="small" x="58" y="956">O diagrama traduz esse valor</text>
    <text class="small" x="58" y="988">para as mesmas decisoes usadas</text>
    <text class="small" x="58" y="1020">nos IFs do codigo.</text>
  </g>

  <g transform="translate(548 286)">
    <rect class="paper" x="0" y="0" width="950" height="470" rx="18"/>
    <circle cx="66" cy="64" r="24" fill="#53694f"/>
    <text class="ruleNum" x="66" y="71" text-anchor="middle">01</text>
    <text class="eyebrow" x="108" y="56">REGRA DE LIBERACAO</text>
    <text class="panelTitle" x="58" y="136">Autorizar</text>
    <text class="formulaSage" x="58" y="190">A . B . C . D . E</text>
    <text class="small" x="58" y="238">Todos os checks precisam resultar em 1.</text>
    <text class="small" x="58" y="268">Se uma entrada falhar, o modulo nao pousa.</text>

    <g transform="translate(390 78)">
      <text class="small" x="0" y="53">A</text>
      <text class="small" x="0" y="103">B</text>
      <text class="small" x="0" y="153">C</text>
      <text class="small" x="0" y="203">D</text>
      <text class="small" x="0" y="253">E</text>
      <line class="wire" x1="26" y1="47" x2="206" y2="47"/>
      <line class="wire" x1="26" y1="97" x2="206" y2="97"/>
      <line class="wire" x1="26" y1="147" x2="206" y2="147"/>
      <line class="wire" x1="26" y1="197" x2="206" y2="197"/>
      <line class="wire" x1="26" y1="247" x2="206" y2="247"/>
      <line class="wire" x1="70" y1="47" x2="70" y2="247"/>
      <circle class="node" cx="70" cy="47" r="5"/>
      <circle class="node" cx="70" cy="97" r="5"/>
      <circle class="node" cx="70" cy="147" r="5"/>
      <circle class="node" cx="70" cy="197" r="5"/>
      <circle class="node" cx="70" cy="247" r="5"/>

      <path class="gate" d="M 206 18 L 282 18 Q 392 18 392 147 Q 392 276 282 276 L 206 276 Z"/>
      <text class="gateText" x="310" y="155" text-anchor="middle">AND</text>
      <line class="sageWire" x1="392" y1="147" x2="466" y2="147"/>
    </g>

    <g transform="translate(828 170)">
      <rect class="sageBox" x="0" y="0" width="84" height="122" rx="14"/>
      <text class="label" x="42" y="42" text-anchor="middle" fill="#53694f">1</text>
      <text class="tiny" x="42" y="74" text-anchor="middle">pouso</text>
      <text class="tiny" x="42" y="98" text-anchor="middle">liberado</text>
    </g>
  </g>

  <g transform="translate(548 816)">
    <rect class="paper" x="0" y="0" width="950" height="470" rx="18"/>
    <circle cx="66" cy="64" r="24" fill="#a45d45"/>
    <text class="ruleNum" x="66" y="71" text-anchor="middle">02</text>
    <text class="eyebrow" x="108" y="56">REGRA DE BLOQUEIO</text>
    <text class="panelTitle" x="58" y="136">Alerta</text>
    <text class="formulaClay" x="58" y="190">A' + B' + C' + D' + E'</text>
    <text class="small" x="58" y="238">Qualquer check falso ja basta para travar.</text>
    <text class="small" x="58" y="268">O modulo aguarda uma nova janela segura.</text>

    <g transform="translate(390 78)">
      <text class="small" x="0" y="53">A</text>
      <text class="small" x="0" y="103">B</text>
      <text class="small" x="0" y="153">C</text>
      <text class="small" x="0" y="203">D</text>
      <text class="small" x="0" y="253">E</text>
      <line class="wire" x1="26" y1="47" x2="112" y2="47"/>
      <line class="wire" x1="26" y1="97" x2="112" y2="97"/>
      <line class="wire" x1="26" y1="147" x2="112" y2="147"/>
      <line class="wire" x1="26" y1="197" x2="112" y2="197"/>
      <line class="wire" x1="26" y1="247" x2="112" y2="247"/>

      <polygon class="gate" points="112,25 172,47 112,69"/>
      <circle class="notDot" cx="183" cy="47" r="8"/>
      <polygon class="gate" points="112,75 172,97 112,119"/>
      <circle class="notDot" cx="183" cy="97" r="8"/>
      <polygon class="gate" points="112,125 172,147 112,169"/>
      <circle class="notDot" cx="183" cy="147" r="8"/>
      <polygon class="gate" points="112,175 172,197 112,219"/>
      <circle class="notDot" cx="183" cy="197" r="8"/>
      <polygon class="gate" points="112,225 172,247 112,269"/>
      <circle class="notDot" cx="183" cy="247" r="8"/>

      <line class="wire" x1="191" y1="47" x2="260" y2="47"/>
      <line class="wire" x1="191" y1="97" x2="260" y2="97"/>
      <line class="wire" x1="191" y1="147" x2="260" y2="147"/>
      <line class="wire" x1="191" y1="197" x2="260" y2="197"/>
      <line class="wire" x1="191" y1="247" x2="260" y2="247"/>

      <path class="gate" d="M 260 18 C 356 76 392 120 392 147 C 392 174 356 218 260 276 C 322 198 322 96 260 18 Z"/>
      <text class="gateText" x="337" y="155" text-anchor="middle">OR</text>
      <line class="clayWire" x1="392" y1="147" x2="466" y2="147"/>
    </g>

    <g transform="translate(828 170)">
      <rect class="clayBox" x="0" y="0" width="84" height="122" rx="14"/>
      <text class="label" x="42" y="42" text-anchor="middle" fill="#8d4b39">!</text>
      <text class="tiny" x="42" y="74" text-anchor="middle">alerta</text>
      <text class="tiny" x="42" y="98" text-anchor="middle">ativo</text>
    </g>
  </g>

  <g transform="translate(548 1350)">
    <rect class="paper" x="0" y="0" width="950" height="116" rx="18"/>
    <text class="eyebrow" x="38" y="48">SAIDA FINAL NO PROTOTIPO</text>
    <rect class="sageBox" x="38" y="68" width="184" height="28" rx="14"/>
    <text class="tiny" x="130" y="88" text-anchor="middle" fill="#53694f">POUSADO</text>
    <rect class="amberBox" x="262" y="68" width="184" height="28" rx="14"/>
    <text class="tiny" x="354" y="88" text-anchor="middle" fill="#81601f">ESPERA</text>
    <rect class="clayBox" x="486" y="68" width="184" height="28" rx="14"/>
    <text class="tiny" x="578" y="88" text-anchor="middle" fill="#8d4b39">ALERTA</text>
    <text class="tiny" x="710" y="88">resultado usado pelo codigo Python</text>
  </g>
</svg>
